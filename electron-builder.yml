appId: com.aipot.app
productName: AiPot
electronDownload:
  mirror: https://registry.npmmirror.com/-/binary/electron/
directories:
  output: dist
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - public/icon.png
  - package.json
  - '!node_modules/**'
  - '!dist/**'
asar: true
electronLanguages:
  - en-US
  - zh-CN
asarUnpack:
  - '**/*.node'
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
artifactName: AiPot-${version}-${os}-${arch}.${ext}
# No `publish` section: self-built private builds must not auto-update from
# the official GitHub releases (electron-updater would overwrite the local
# patches). Update distribution will be configured when the fork goes public.
win:
  icon: public/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  artifactName: AiPot-Setup-${version}.${ext}
portable:
  artifactName: AiPot-${version}-portable-${arch}.${ext}
linux:
  icon: public
  category: Utility
  maintainer: AiPot contributors
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
